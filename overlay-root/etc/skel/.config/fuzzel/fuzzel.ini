# fuzzel -- pure-wlroots app launcher / dmenu. Replaces wofi.
# Tuned narrow for the 1280x480 landscape panel.

[main]
font=Noto Sans:size=11
terminal=footclient
layer=overlay
width=40
lines=8
horizontal-pad=12
vertical-pad=8
inner-pad=4
prompt=">  "
icon-theme=Adwaita
show-actions=yes

[colors]
background=101418ee
text=d6deebff
match=f1fa8cff
selection=2a3a5aff
selection-text=d6deebff
border=2a3a5aff

[border]
width=1
radius=2

[dmenu]
exit-on-kb-focus-loss=yes
